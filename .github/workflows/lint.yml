name: Lint skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md frontmatter
        run: |
          set -e
          missing=0
          names_file="$(mktemp)"
          trap 'rm -f "$names_file"' EXIT
          while IFS= read -r skill; do
            skill_dir="$(dirname "$skill")"
            skill_name="$(basename "$skill_dir")"
            frontmatter_name="$(sed -n 's/^name: //p' "$skill" | head -n 1)"
            if [ "$(dirname "$skill_dir")" != ".agents/skills" ]; then
              echo "Nested skill leaf: $skill"
              missing=1
            fi
            if ! grep -q '^name:' "$skill"; then
              echo "Missing name in $skill"
              missing=1
            elif [ "$frontmatter_name" != "$skill_name" ]; then
              echo "Folder/frontmatter mismatch: $skill_name != $frontmatter_name"
              missing=1
            fi
            if ! grep -q '^description:' "$skill"; then
              echo "Missing description in $skill"
              missing=1
            fi
            if grep -qxF "$skill_name" "$names_file"; then
              echo "Duplicate skill name: $skill_name"
              missing=1
            else
              echo "$skill_name" >>"$names_file"
            fi
          done < <(find .agents/skills -name SKILL.md | sort)
          exit $missing

      - name: Check Project Context footer
        run: |
          set -e
          missing=0
          while IFS= read -r skill; do
            if ! grep -q '## Project Context' "$skill"; then
              echo "Missing Project Context footer in $skill"
              missing=1
            fi
            if ! grep -q 'context.md' "$skill"; then
              echo "Missing context.md link in $skill"
              missing=1
            fi
          done < <(find .agents/skills -name SKILL.md)
          exit $missing

      - name: Check for internal codebase leaks
        run: |
          if grep -rE "(server/src/|client/src/|@/|cubic\.yaml)" .agents/skills/; then
            echo "ERROR: internal codebase references found"
            exit 1
          fi
          echo "No internal codebase leaks"

      - name: Check kstack agent paths
        run: |
          set -e
          if [ ! -f .agents/agents/kstack.md ]; then
            echo "Missing .agents/agents/kstack.md"
            exit 1
          fi
          if grep -q '\.cursor/skills' .agents/agents/kstack.md; then
            echo "ERROR: kstack agent still references .cursor/skills"
            exit 1
          fi
          if ! grep -q '\.agents/skills' .agents/agents/kstack.md; then
            echo "ERROR: kstack agent missing .agents/skills references"
            exit 1
          fi
